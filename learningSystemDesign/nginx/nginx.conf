events{

}
http{

    upstream backend{ # here the name of variable is backend and it is used in proxy_pass directive and upstream directive is used to define a group of servers that can be used for load balancing
        server server1:7000;
        server server2:7000;
        server server3:7000;

    } 
    server{
        listen 80;
        location /{
            # return 200 "hello from Suraj 666";  Using nginx as web server

            #Now using it as load balancer
            proxy_pass http://backend;
        }
    }
}