services:
    nginx:
      image: nginx
      ports:
        - 8080:80
      volumes:
        - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    
    gateway1:
      build: ./backend/gateway
      env_file:
        - ./backend/gateway/.env
      environment:
        - SERVER_NAME=1st Gateway
      ports:
        - 8004:8000
    gateway2:
      build: ./backend/gateway
      env_file:
        - ./backend/gateway/.env
      environment:
        - SERVER_NAME=2nd Gateway
      ports:
        - 8005:8000

    auth-service:
      build: ./backend/services/auth
      env_file:
        - ./backend/services/auth/.env
      ports:
        - 6001:8001
    order-service:
      build: ./backend/services/order
      env_file:
        - ./backend/services/order/.env
      ports:
        - 6002:8002
    product-service:
      build: ./backend/services/product
      env_file:
        - ./backend/services/product/.env
      ports:
        - 6003:8003
